<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MLBB Edu-Adventure</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Oswald:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ml-gold: #c9a45c;
            --ml-gold-dark: #8a6d3b;
            --ml-cyan: #00ffcc;
        }
        
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Roboto', sans-serif;
            background-color: #000;
            color: white;
            touch-action: manipulation;
        }

        .ml-font { font-family: 'Cinzel', serif; }

        #game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            background-image: url('https://i.imgur.com/ULWCp4n.png');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
        }

        .screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.75);
            padding: 1rem;
            z-index: 10;
        }

        /* Splash Screen Styling */
        #splash-screen {
            background-color: #ffffff;
            z-index: 100;
        }

        .zoom-in-text {
            animation: zoomIn 6s ease-out forwards;
            opacity: 0;
        }

        @keyframes zoomIn {
            0% { transform: scale(0.8); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: scale(1.1); opacity: 0; }
        }

        .hidden { display: none !important; }

        .btn-ml {
            background: linear-gradient(to bottom, var(--ml-gold), var(--ml-gold-dark));
            border: 2px solid #fff;
            padding: 12px 24px;
            color: #fff;
            text-transform: uppercase;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            clip-path: polygon(5% 0, 100% 0, 95% 100%, 0% 100%);
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .btn-ml:active { transform: scale(0.95); }

        /* Hero Card Effects */
        .hero-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 12px;
            width: 100%;
            max-width: 600px;
            max-height: 60vh;
            overflow-y: auto;
            padding: 15px;
        }
        .hero-card {
            background: rgba(20, 20, 20, 0.9);
            border: 2px solid rgba(201, 164, 92, 0.3);
            border-radius: 8px;
            overflow: hidden;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            position: relative;
        }
        .hero-card img { 
            width: 100%; 
            aspect-ratio: 1/1; 
            object-fit: cover; 
            filter: grayscale(40%);
            transition: all 0.4s ease;
        }
        .hero-card:hover {
            border-color: var(--ml-gold);
            transform: translateY(-5px);
        }
        
        .hero-card.selected { 
            border-color: var(--ml-cyan); 
            box-shadow: 0 0 20px var(--ml-cyan); 
            transform: scale(1.08);
            z-index: 5;
            animation: hero-pulse 2s infinite;
        }
        .hero-card.selected img {
            filter: grayscale(0%) contrast(110%);
        }
        .hero-card.selected::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            box-shadow: inset 0 0 15px var(--ml-cyan);
            pointer-events: none;
        }

        @keyframes hero-pulse {
            0% { box-shadow: 0 0 10px var(--ml-cyan); }
            50% { box-shadow: 0 0 25px var(--ml-cyan); }
            100% { box-shadow: 0 0 10px var(--ml-cyan); }
        }

        .arena-layout {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            gap: 1rem;
        }

        @media (orientation: portrait) {
            .question-area { flex: 1; display: flex; flex-direction: column; justify-content: center; }
            .options-area { display: grid; grid-template-columns: 1fr; gap: 8px; padding-bottom: 2rem; }
        }

        @media (orientation: landscape) {
            .arena-layout { flex-direction: row; align-items: center; padding: 2rem; }
            .question-area { flex: 1.5; }
            .options-area { flex: 1; display: grid; grid-template-columns: 1fr; gap: 10px; }
            .message-box { max-width: 800px; width: 100%; }
        }

        .message-box {
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid var(--ml-gold);
            padding: 1.5rem;
            border-radius: 12px;
            position: relative;
        }

        .btn-correct { background: #10b981 !important; border-color: white !important; }
        .btn-wrong { background: #ef4444 !important; border-color: white !important; }

        .volume-control {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 100;
            background: rgba(0,0,0,0.6);
            padding: 8px;
            border-radius: 50%;
            border: 1px solid var(--ml-gold);
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--ml-gold);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <audio id="bg-music" loop>
        <source src="https://github.com/Suci1788/musikku/raw/refs/heads/main/Ascension_of_the_Valiant.mp3" type="audio/mpeg">
    </audio>

    <div id="game-container">
        <div class="volume-control" onclick="toggleMusic()">
            <svg id="music-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
        </div>

        <!-- Perbaikan Splash Screen Sesuai Permintaan -->
        <div id="splash-screen" class="screen">
            <div class="text-center px-6 zoom-in-text">
                <h2 class="text-gray-500 font-bold text-lg mb-2 uppercase tracking-widest">Created by</h2>
                <h1 class="text-blue-700 font-black text-3xl md:text-5xl mb-3">SUCI MEGA DIAN SARI</h1>
                <div class="h-1 w-24 bg-blue-600 mx-auto mb-4"></div>
                <p class="text-gray-800 text-base md:text-xl font-bold leading-tight">
                    Duta Teknologi Kemendikdasmen<br>
                    <span class="text-blue-600">Prov. Banten</span>
                </p>
            </div>
        </div>

        <div id="start-menu" class="screen hidden">
            <h1 class="ml-font text-3xl md:text-6xl text-yellow-500 mb-8 text-center px-4">MLBB EDU</h1>
            <div class="flex flex-col gap-4 w-64">
                <button onclick="showObjectives()" class="btn-ml">Main Sekarang</button>
                <button onclick="showLeaderboard()" class="btn-ml opacity-80">Leaderboard</button>
            </div>
        </div>

        <div id="objectives-screen" class="screen hidden">
            <div class="message-box w-full max-w-sm">
                <h2 class="ml-font text-xl text-yellow-400 mb-4">Tujuan</h2>
                <p class="text-sm text-gray-300 mb-6 italic">Gunakan pengetahuanmu untuk mengalahkan tantangan di Land of Dawn.</p>
                <button onclick="showHeroSelection()" class="btn-ml w-full">Pilih Hero</button>
            </div>
        </div>

        <div id="hero-screen" class="screen hidden">
            <h2 class="ml-font text-xl text-yellow-400 mb-4">PILIH HERO</h2>
            <div class="hero-grid" id="hero-list"></div>
            <div id="difficulty-area" class="mt-4 hidden w-full max-w-sm">
                <div class="flex flex-col gap-2">
                    <p class="text-center text-xs text-yellow-500 mb-1">PILIH TINGKAT KESULITAN</p>
                    <div class="flex gap-2">
                        <button onclick="startGame('Mudah')" class="btn-ml flex-1 bg-green-800 text-[10px]">Mudah</button>
                        <button onclick="startGame('Sedang')" class="btn-ml flex-1 bg-yellow-800 text-[10px]">Sedang</button>
                        <button onclick="startGame('Sulit')" class="btn-ml flex-1 bg-red-800 text-[10px]">Sulit</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="arena" class="screen hidden">
            <div class="arena-layout">
                <div class="question-area">
                    <div class="flex justify-between items-center mb-2 px-2">
                        <span id="display-info" class="text-[10px] text-yellow-500 font-bold uppercase"></span>
                        <span id="lives-display" class="text-red-500">❤️❤️❤️</span>
                    </div>
                    <div class="message-box">
                        <div id="timer-bar" class="w-full bg-gray-800 h-1.5 mb-4 rounded-full overflow-hidden">
                            <div id="timer-progress" class="bg-yellow-500 h-full w-full"></div>
                        </div>
                        <p id="question-text" class="text-lg font-bold leading-tight"></p>
                    </div>
                </div>
                <div class="options-area" id="options-container"></div>
            </div>
            <div class="absolute bottom-4 left-4">
                <p class="text-xs text-gray-400">Score: <span id="score-display" class="text-white font-bold">0</span></p>
            </div>
        </div>

        <div id="leaderboard-screen" class="screen hidden">
            <div class="message-box w-full max-w-md flex flex-col h-[70vh]">
                <h2 class="ml-font text-xl text-yellow-400 mb-4 text-center">LEADERBOARD GLOBAL</h2>
                <div id="lb-loading" class="text-center py-4 hidden"><div class="loader"></div></div>
                <div id="leaderboard-content" class="flex-1 overflow-y-auto space-y-2 mb-4 pr-2"></div>
                <button onclick="goHome()" class="btn-ml w-full">Kembali</button>
            </div>
        </div>

        <div id="game-over" class="screen hidden">
            <div class="message-box w-full max-w-sm text-center">
                <h2 id="result-text" class="ml-font text-3xl mb-2">DEFEAT</h2>
                <p class="text-lg mb-6">Skor: <span id="final-score" class="text-yellow-400 font-bold">0</span></p>
                <input type="text" id="player-name" placeholder="Nama Warrior..." class="w-full p-3 bg-white text-black rounded mb-4 font-bold uppercase">
                <button id="save-btn" onclick="saveToCloud()" class="btn-ml w-full">Kirim Skor</button>
                <button onclick="goHome()" class="mt-4 text-xs text-gray-400 underline">Menu Utama</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'mlbb-edu-v3';

        let user = null;
        let score = 0;
        let lives = 3;
        let currentSubject = "";
        let currentLevel = "";
        let questions = [];
        let qIdx = 0;
        let timer;
        let musicStarted = false;

        const HEROES = [
            { name: 'Gatot', sub: 'Pancasila', img: 'https://i.imgur.com/L5CXFoH.jpeg' },
            { name: 'Tigreal', sub: 'Matematika', img: 'https://i.imgur.com/bsBwo5M.jpeg' },
            { name: 'Lukas', sub: 'IPAS', img: 'https://i.imgur.com/GSe5nDU.jpeg' },
            { name: 'Alucard', sub: 'B. Indonesia', img: 'https://i.imgur.com/2tGCvwq.jpeg' },
            { name: 'Zilong', sub: 'B. Inggris', img: 'https://i.imgur.com/WJ31qiq.jpeg' }
        ];

        const BANK = {
            'Pancasila': [
                {q:"Lambang sila ke-3?", a:["Banteng","Beringin","Padi","Rantai"], c:1},
                {q:"Sila ke-2 berbunyi...", a:["Persatuan Indonesia","Keadilan Sosial","Kemanusiaan yang adil dan beradab","Ketuhanan YME"], c:2},
                {q:"Warna pada bintang emas sila ke-1 melambangkan...", a:["Cahaya Kerohanian","Keberanian","Kemakmuran","Persatuan"], c:0},
                {q:"Jumlah bulu pada sayap Garuda adalah...", a:["17","8","45","19"], c:0},
                {q:"Siapa perumus Pancasila?", a:["Ir. Soekarno","Muh. Yamin","Soepomo","Semua Benar"], c:3},
                {q:"Pancasila disahkan pada tanggal...", a:["1 Juni 1945","17 Agustus 1945","18 Agustus 1945","1 Oktober 1945"], c:2},
                {q:"Pohon Beringin melambangkan sila ke...", a:["1","2","3","4"], c:2},
                {q:"Bhinneka Tunggal Ika artinya...", a:["Berbeda tapi satu","Satu untuk semua","Beda itu indah","Satu nusa satu bangsa"], c:0}
            ],
            'Matematika': [
                {q:"15 x 4 + 10?", a:["60","70","50","80"], c:1},
                {q:"Akar kuadrat dari 144?", a:["10","12","14","16"], c:1},
                {q:"25% dari 200?", a:["25","40","50","100"], c:2},
                {q:"Hasil dari 1/2 + 1/4?", a:["2/4","3/4","1/6","1/2"], c:1},
                {q:"Sisi x Sisi adalah rumus luas...", a:["Persegi","Segitiga","Lingkaran","Trapesium"], c:0},
                {q:"Berapa derajat sudut siku-siku?", a:["45","90","180","360"], c:1},
                {q:"Bilangan prima setelah 7?", a:["8","9","10","11"], c:3},
                {q:"5 pangkat 3 adalah...", a:["15","25","125","75"], c:2}
            ],
            'IPAS': [
                {q:"Pusat tata surya?", a:["Bumi","Matahari","Bulan","Mars"], c:1},
                {q:"Bagian tumbuhan yang menyerap air?", a:["Daun","Batang","Akar","Bunga"], c:2},
                {q:"Gas yang kita hirup untuk bernapas?", a:["Oksigen","Nitrogen","Karbon Dioksida","Hidrogen"], c:0},
                {q:"Hewan pemakan segalanya disebut...", a:["Herbivora","Karnivora","Omnivora","Insektivora"], c:2},
                {q:"Planet merah adalah...", a:["Venus","Mars","Jupiter","Saturnus"], c:1},
                {q:"Perubahan wujud dari cair ke gas?", a:["Mencair","Membeku","Menguap","Mengembun"], c:2},
                {q:"Alat pernapasan ikan?", a:["Paru-paru","Trakea","Insang","Kulit"], c:2},
                {q:"Tulang rusuk melindungi organ...", a:["Otak","Jantung & Paru","Lambung","Hati"], c:1}
            ],
            'B. Indonesia': [
                {q:"Antonim Tinggi?", a:["Pendek","Kecil","Lebar","Jauh"], c:0},
                {q:"Ide pokok biasanya terdapat pada...", a:["Kalimat Utama","Kalimat Penjelas","Kesimpulan","Judul"], c:0},
                {q:"Penulisan yang benar adalah...", a:["Apotik","Apotek","Apoteg","Apoteek"], c:1},
                {q:"Kata 'berlari' memiliki imbuhan...", a:["ber-","me-","di-","ter-"], c:0},
                {q:"Sinonim kata 'Bahagia'?", a:["Sedih","Senang","Duka","Lelah"], c:1},
                {q:"Tokoh jahat dalam cerita disebut...", a:["Protagonis","Antagonis","Tritagonis","Figuran"], c:1},
                {q:"Latar tempat dalam cerita disebut...", a:["Alur","Setting","Tema","Amanat"], c:1},
                {q:"Kalimat tanya diakhiri tanda...", a:[".","?", "!", ","], c:1}
            ],
            'B. Inggris': [
                {q:"'Apple' is a...?", a:["Color","Fruit","Animal","Job"], c:1},
                {q:"Translate 'Selamat Pagi'...", a:["Good Night","Good Morning","Good Afternoon","Goodbye"], c:1},
                {q:"How many days in a week?", a:["5","6","7","8"], c:2},
                {q:"'Blue' in Indonesian is...", a:["Merah","Kuning","Biru","Hijau"], c:2},
                {q:"I have two ... (mata).", a:["Ears","Eyes","Noses","Hands"], c:1},
                {q:"A cat says...", a:["Woof","Meow","Moo","Quack"], c:1},
                {q:"Opposite of 'Big'?", a:["Small","Tall","Short","Long"], c:0},
                {q:"'Library' is a place for...", a:["Swimming","Reading","Eating","Sleeping"], c:1}
            ]
        };

        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Auth error:", error);
            }
            onAuthStateChanged(auth, (u) => user = u);
        }

        window.toggleMusic = () => {
            const m = document.getElementById('bg-music');
            m.paused ? m.play() : m.pause();
        };

        function startMusic() {
            if(!musicStarted) {
                document.getElementById('bg-music').play().catch(()=>{});
                musicStarted = true;
            }
        }

        window.showObjectives = () => {
            startMusic();
            switchScreen('start-menu', 'objectives-screen');
        };

        window.showHeroSelection = () => {
            switchScreen('objectives-screen', 'hero-screen');
            const list = document.getElementById('hero-list');
            list.innerHTML = HEROES.map(h => `
                <div class="hero-card" onclick="selectHero('${h.name}', '${h.sub}')" id="hero-${h.name}">
                    <img src="${h.img}" alt="${h.name}">
                    <p class="text-[10px] font-bold p-1 uppercase tracking-wider">${h.name}</p>
                </div>
            `).join('');
        };

        window.selectHero = (name, sub) => {
            currentSubject = sub;
            document.querySelectorAll('.hero-card').forEach(c => c.classList.remove('selected'));
            document.getElementById(`hero-${name}`).classList.add('selected');
            document.getElementById('difficulty-area').classList.remove('hidden');
            document.getElementById('difficulty-area').scrollIntoView({ behavior: 'smooth' });
        };

        window.startGame = (lvl) => {
            currentLevel = lvl;
            score = 0; lives = 3; qIdx = 0;
            const fullBank = BANK[currentSubject];
            questions = [...fullBank].sort(() => Math.random() - 0.5);
            switchScreen('hero-screen', 'arena');
            loadQ();
        };

        function loadQ() {
            if (lives <= 0 || qIdx >= questions.length) return endGame();
            
            const q = questions[qIdx];
            document.getElementById('question-text').innerText = q.q;
            document.getElementById('score-display').innerText = score;
            document.getElementById('lives-display').innerText = "❤️".repeat(lives);
            document.getElementById('display-info').innerText = `${currentSubject} | ${currentLevel}`;
            
            const container = document.getElementById('options-container');
            container.innerHTML = "";
            q.a.forEach((opt, i) => {
                const b = document.createElement('button');
                b.className = "btn-ml bg-blue-900/50 normal-case !clip-none text-xs";
                b.innerText = opt;
                b.onclick = () => check(i);
                container.appendChild(b);
            });
            
            startTimer();
        }

        function startTimer() {
            clearInterval(timer);
            let val = 100;
            let step;
            if(currentLevel === 'Mudah') step = 0.4;
            else if(currentLevel === 'Sedang') step = 0.8;
            else step = 1.5;

            timer = setInterval(() => {
                val -= step;
                document.getElementById('timer-progress').style.width = val + "%";
                if(val <= 0) { clearInterval(timer); check(-1); }
            }, 100);
        }

        function check(idx) {
            clearInterval(timer);
            const correct = questions[qIdx].c;
            const btns = document.querySelectorAll('#options-container button');
            
            if (idx === correct) {
                if(btns[idx]) btns[idx].classList.add('btn-correct');
                let points = 10;
                if(currentLevel === 'Sedang') points = 20;
                if(currentLevel === 'Sulit') points = 35;
                score += points;
            } else {
                if (idx !== -1 && btns[idx]) btns[idx].classList.add('btn-wrong');
                if(btns[correct]) btns[correct].classList.add('btn-correct');
                lives--;
            }

            setTimeout(() => { qIdx++; loadQ(); }, 1000);
        }

        function endGame() {
            switchScreen('arena', 'game-over');
            document.getElementById('final-score').innerText = score;
            document.getElementById('result-text').innerText = lives > 0 ? "VICTORY" : "DEFEAT";
            document.getElementById('result-text').className = lives > 0 ? "ml-font text-3xl mb-2 text-green-500" : "ml-font text-3xl mb-2 text-red-500";
        }

        window.saveToCloud = async () => {
            const name = document.getElementById('player-name').value.trim();
            if (!name || !user) return;
            
            const btn = document.getElementById('save-btn');
            btn.disabled = true;
            btn.innerText = "Mengirim...";

            try {
                const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard');
                await addDoc(colRef, {
                    name,
                    score,
                    subject: currentSubject,
                    level: currentLevel,
                    timestamp: Date.now(),
                    uid: user.uid
                });
                showLeaderboard();
            } catch (e) {
                console.error(e);
                btn.disabled = false;
                btn.innerText = "Coba Lagi";
            }
        };

        window.showLeaderboard = async () => {
            switchScreen(null, 'leaderboard-screen');
            const list = document.getElementById('leaderboard-content');
            const loader = document.getElementById('lb-loading');
            list.innerHTML = "";
            loader.classList.remove('hidden');

            try {
                const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard');
                const snap = await getDocs(colRef);
                const data = snap.docs.map(d => d.data())
                    .sort((a, b) => b.score - a.score)
                    .slice(0, 20);

                loader.classList.add('hidden');
                if (data.length === 0) {
                    list.innerHTML = "<p class='text-center text-gray-500 mt-10'>Belum ada pahlawan.</p>";
                } else {
                    list.innerHTML = data.map((item, i) => `
                        <div class="flex justify-between items-center bg-white/5 p-3 rounded border-l-4 border-yellow-500">
                            <div>
                                <p class="text-xs text-yellow-500 font-bold">#${i+1} ${item.name}</p>
                                <p class="text-[10px] text-gray-400">${item.subject} | ${item.level}</p>
                            </div>
                            <p class="font-bold text-green-400">${item.score}</p>
                        </div>
                    `).join('');
                }
            } catch (e) {
                loader.classList.add('hidden');
                list.innerHTML = "<p class='text-red-500 text-xs'>Gagal memuat data.</p>";
            }
        };

        window.goHome = () => {
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById('start-menu').classList.remove('hidden');
            document.getElementById('save-btn').disabled = false;
            document.getElementById('save-btn').innerText = "Kirim Skor";
            document.getElementById('player-name').value = "";
        };

        function switchScreen(fromId, toId) {
            if(fromId) document.getElementById(fromId).classList.add('hidden');
            if(toId) document.getElementById(toId).classList.remove('hidden');
        }

        initAuth();
        // Splash screen berdurasi 6 detik (6000ms)
        setTimeout(() => switchScreen('splash-screen', 'start-menu'), 6000);
    </script>
</body>
</html>
